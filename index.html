<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFplayOfficial - Every PDF Tool You Need. Free and Simple.</title>
    <meta name="description" content="Merge, split, compress, convert, edit, and manage your PDF files online. No signup. No login. No hassle. 100% free PDF tools." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
                800: '#1e40af', 900: '#1e3a8a',
              },
              accent: {
                50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc',
                400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf',
              },
              success: { 500: '#22c55e', 600: '#16a34a' },
              warning: { 500: '#f59e0b' },
              danger: { 500: '#ef4444', 600: '#dc2626' },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; color: #1e293b; }
      .drop-zone { border: 2px dashed #cbd5e1; border-radius: 12px; transition: all 0.3s ease; }
      .drop-zone:hover, .drop-zone.drag-over { border-color: #3b82f6; background-color: #eff6ff; }
      .tool-card { transition: all 0.2s ease; }
      .tool-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.15); }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
