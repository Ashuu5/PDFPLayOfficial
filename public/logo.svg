<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1d29" />
      <stop offset="100%" stop-color="#0d1117" />
    </radialGradient>

    <linearGradient id="starBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" />
      <stop offset="25%"  stop-color="#e5e7eb" />
      <stop offset="50%"  stop-color="#9ca3af" />
      <stop offset="75%"  stop-color="#6b7280" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>

    <radialGradient id="innerCircle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2d3a" />
      <stop offset="100%" stop-color="#0f1117" />
    </radialGradient>

    <linearGradient id="docBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f3f4f6" />
      <stop offset="50%"  stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#bgGlow)" />

  <path
    d="M120 10 Q130 100 230 120 Q130 140 120 230 Q110 140 10 120 Q110 100 120 10 Z"
    fill="#d1d5db"
    opacity="0.25"
    filter="url(#glow)"
  />

  <path
    d="M120 10 Q130 100 230 120 Q130 140 120 230 Q110 140 10 120 Q110 100 120 10 Z"
    fill="url(#starBody)"
  />

  <path
    d="M120 10 Q130 100 230 120 Q130 140 120 230 Z"
    fill="#ffffff"
    opacity="0.15"
  />

  <circle cx="120" cy="120" r="48" fill="url(#innerCircle)" />

  <rect x="98" y="96" width="44" height="52" rx="8" fill="url(#docBody)" />

  <rect x="106" y="108" width="28" height="3" rx="1.5" fill="#374151" />
  <rect x="106" y="117" width="28" height="3" rx="1.5" fill="#374151" />
  <rect x="106" y="126" width="18" height="3" rx="1.5" fill="#374151" />

  <rect x="98" y="96" width="44" height="26" rx="8" fill="#ffffff" opacity="0.15" />
</svg>